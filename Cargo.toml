[package]
name = "rusty_dock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
# Software renderer only: an OpenGL context loads the GPU driver (~40 MB on NVIDIA) into a
# window this small and static.
slint = { version = "1.16.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "raw-window-handle-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# config.toml
toml = "0.8"
# Decodes cached artwork that has no file extension (Slint picks its decoder by extension).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# The EA app names its splash artwork after the SHA-256 of a game's content id.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.16.0"
# Embeds assets/icon.ico in the Windows exe (rc.exe, or MinGW's windres when cross-compiling).
embed-resource = "3"
